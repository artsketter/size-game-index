<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="brand" href="index.html" id="brand"><img src="logo.svg" alt="" width="34" height="34"><span>Game Shelf</span></a>
  <input id="search" type="search" placeholder="Search titles, tags, keywords…" aria-label="Search games">
</header>
<main id="home">
  <section class="intro">
    <p>A hand-kept shelf of games, each with notes on its art, mechanics and story. Sort by what matters to you, or hide the tags you never want to see.</p>
    <nav class="tabs" id="tabs" aria-label="Sorting modes"></nav>
    <div id="filterPanel" class="filter-panel" hidden></div>
  </section>
  <section id="gallery" class="gallery" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>No games match. Clear the search or adjust your filters.</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
