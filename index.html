<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shelf</title>
<link rel="icon" href="tthinkCrop.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="brand" href="index.html" id="brand"><img src="tthinkCrop.png" alt="" width="34" height="34"><span>Size Game Index</span></a>
  <input id="search" type="search" placeholder="Search titles, tags, keywords…" aria-label="Search games">
</header>
<main id="home">
  <section class="intro">
    <p>Comprehensive spreadsheet for games with significant size content, curated by @artsketter.<br>
      <i>(A “size” game contains content relating to unnatural size disparities between characters, typically with elements of domination)</i></p>
    <nav class="tabs" id="tabs" aria-label="Sorting modes"></nav>
    <div id="filterPanel" class="filter-panel" hidden></div>
  </section>
  <section id="gallery" class="gallery" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>No games match. Clear the search or adjust your filters.</p>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
