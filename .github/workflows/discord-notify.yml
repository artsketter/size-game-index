name: Notify Discord

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post commits titled "New"
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          echo "$COMMITS" | jq -c '.[]' | while read -r c; do
            title=$(echo "$c" | jq -r '.message | split("\n")[0]')
            url=$(echo "$c" | jq -r '.url')
            if [[ "$title" == *"New"* ]]; then
              jq -n --arg content "$title"$'\n'"$url" '{content: $content}' \
                | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
            fi
          done